services:
  db:
    build:
      context: .
      dockerfile: infra/postgres.Dockerfile
    image: localhost/land-to-homes-postgis:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-land_to_homes}
      POSTGRES_USER: ${POSTGRES_USER:-land_to_homes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-land_to_homes}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-land_to_homes}:${POSTGRES_PASSWORD:-land_to_homes}@db:5432/${POSTGRES_DB:-land_to_homes}
      CORS_ORIGINS: '["http://localhost:5173"]'
      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_BASEMAP_URL: ${VITE_BASEMAP_URL:-}
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
