[project]
name = "land-to-homes"
version = "0.1.0"
description = "Screen publicly owned Chicago parcels for transit-accessible housing potential."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.116",
  "geoalchemy2>=0.18",
  "geopandas>=1.1",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.10",
  "pyproj>=3.7",
  "shapely>=2.1",
  "sqlalchemy>=2.0",
  "tenacity>=9.1",
  "uvicorn[standard]>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "pipeline"]

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-shapely>=2.1",
]

[tool.pytest.ini_options]
addopts = "--cov=apps.api.app --cov=pipeline --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["apps.api.app", "pipeline"]
