<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10231c" />
  <meta name="description" content="Explore publicly owned Chicago land for housing potential." />
  <title>Land to Homes</title>
</head>

<body class="min-h-screen min-w-80 bg-stone-100 text-emerald-950 antialiased">
  <main class="min-h-screen p-2.5 md:p-[18px]">
    <header class="mx-auto mb-3.5 flex max-w-[1480px] items-center justify-between">
      <div>
        <p class="mb-1 text-[0.7rem] font-bold tracking-[0.14em] text-emerald-800/70 uppercase">
          Chicago public land explorer
        </p>
        <h1 class="font-serif text-[clamp(1.65rem,4vw,2.45rem)] font-medium tracking-[-0.04em]">
          Land to Homes
        </h1>
      </div>
    </header>

    <section
      class="mx-auto grid min-h-[calc(100vh-104px)] max-w-[1480px] grid-cols-1 overflow-hidden border border-stone-300 bg-amber-50 shadow-[0_22px_60px_rgb(31_47_40/0.12)] md:grid-cols-[minmax(260px,360px)_1fr]"
      aria-label="Land explorer">
      <div id="map" class="min-h-[52vh] bg-stone-200 md:min-h-[620px]" aria-label="Map of Chicago"></div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
